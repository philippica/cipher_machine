<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 多面体编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.131.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.131.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        /* Basic styling for the 3D container and preventing unwanted touch actions */
        #container{width:100%;height:80vh;background-color:#1f2937;border-radius:.5rem;overflow:hidden;touch-action:none;}
        canvas{display:block;}
        #textureEditorContainer {z-index: 1000;}
    </style>
</head>
<body class="bg-gray-50 p-4 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto space-y-4">
        <!-- Main controls for grid generation and mode switching -->
        <div class="bg-white p-4 rounded-xl shadow-lg flex flex-col sm:flex-row items-center justify-between space-y-3 sm:space-y-0 sm:space-x-4">
            <div class="flex items-center space-x-2 w-full sm:w-auto">
                <label for="inputN" class="text-gray-600 font-medium">N:</label>
                <input type="number" id="inputN" value="10" min="1" max="50" class="w-20 p-2 border rounded-lg text-center">
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto">
                <label for="inputM" class="text-gray-600 font-medium">M:</label>
                <input type="number" id="inputM" value="10" min="1" max="50" class="w-20 p-2 border rounded-lg text-center">
            </div>
            <button id="toggleSelectMode" class="w-full sm:w-auto px-4 py-2 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 transition duration-150 shadow-md whitespace-nowrap">
                点击切换到选择模式 (S)
            </button>
            <button id="generateButton" class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition duration-150 shadow-md">
                重新生成网格
            </button>
        </div>
        <!-- The container for the Three.js scene -->
        <div id="container"></div>
        <p id="tipMessage" class="text-sm text-gray-500 text-center">
            提示: 拖动旋转。按 **'C'** 键创建立方体。点击 **'S'** 键或紫色按钮切换到立方体选择模式。
        </p>
    </div>

    <!-- The texture editor side panel -->
    <div id="textureEditorContainer" class="hidden fixed top-0 right-0 h-full w-72 bg-gray-100 p-4 shadow-xl z-10 overflow-y-auto border-l border-gray-300">
        <h3 class="text-xl font-bold mb-3 text-gray-700">几何体编辑器</h3>
        <p class="text-sm text-gray-500 mb-4">在下方画布上绘制，实时更新贴图。</p>
        
        <!-- Controls for the mesh's appearance (color, opacity, shape) -->
        <div class="mt-4 p-3 bg-white rounded-lg shadow-inner mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-3">外观设置 (Mesh)</label>
            
            <div class="flex items-center justify-between space-x-3 mb-4">
                <label for="meshColor" class="text-sm">基础颜色:</label>
                <input type="color" id="meshColor" value="#ffcccc" class="h-8 w-8 rounded-full border-none p-0 cursor-pointer">
            </div>

            <div class="space-y-1 mb-4">
                <label for="meshOpacity" class="text-sm flex justify-between items-center">
                    <span>不透明度:</span>
                    <span id="meshOpacityValue" class="font-mono text-xs text-gray-500">0.6</span>
                </label>
                <input type="range" id="meshOpacity" min="0" max="1" step="0.01" value="0.6" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>

            <button id="toggleGeometry" class="w-full px-3 py-2 text-white font-semibold rounded-lg transition shadow-md bg-green-500 hover:bg-green-600">
                切换到 球体
            </button>
        </div>
        
        <!-- Controls for the drawing brush -->
        <div id="brushControls" class="mt-4 p-3 bg-white rounded-lg shadow-inner mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-3">画笔设置 (Texture)</label>
            <div class="flex items-center justify-between space-x-3 mb-4">
                <label for="brushColor" class="text-sm">颜色:</label>
                <input type="color" id="brushColor" value="#ff0000" class="h-8 w-8 rounded-full border-none p-0 cursor-pointer">
            </div>
            <div class="space-y-1">
                <label for="brushSize" class="text-sm flex justify-between items-center">
                    <span>粗细:</span>
                    <span id="brushSizeValue" class="font-mono text-xs text-gray-500">5px</span>
                </label>
                <input type="range" id="brushSize" min="1" max="50" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>
        <!-- Container for the texture canvases -->
        <div id="textureCanvases" class="grid grid-cols-2 gap-2"></div>
        <button id="deselectCube" class="mt-4 w-full px-3 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition shadow-md">取消选择并关闭</button>
    </div>

    <script>
        // --- Global Variables & Constants ---
        let scene, camera, renderer, controls;
        let planeMesh, highlightMesh;
        let cubes = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let N = 10, M = 10;
        let cw, ch;
        let isSelectMode = false;
        let currentCube = null; 
        let brushColor = '#ff0000';
        let brushSize = 5; 
		
		const direction = new THREE.Vector3();
        const upVector = new THREE.Vector3(0, 1, 0);

        // --- Geometry Constants ---
        const GEOMETRY_TYPE_CUBE = 'cube';
        const GEOMETRY_TYPE_SPHERE = 'sphere';
        const GEOMETRY_TYPE_OCTAHEDRON = 'octahedron';
        const GEOMETRY_TYPE_DODECAHEDRON = 'dodecahedron';
        const GEOMETRY_CYCLE = [GEOMETRY_TYPE_CUBE, GEOMETRY_TYPE_SPHERE, GEOMETRY_TYPE_OCTAHEDRON, GEOMETRY_TYPE_DODECAHEDRON];
        const GEOMETRY_NAMES = {
            [GEOMETRY_TYPE_CUBE]: '立方体',
            [GEOMETRY_TYPE_SPHERE]: '球体',
            [GEOMETRY_TYPE_OCTAHEDRON]: '正八面体',
            [GEOMETRY_TYPE_DODECAHEDRON]: '正十二面体'
        };

        // --- Material Definitions ---
        const DEFAULT_COLOR = 0xffcccc;
        const DEFAULT_OPACITY = 0.6;
        const CUBE_MAT_BASE = { color: DEFAULT_COLOR, opacity: DEFAULT_OPACITY, transparent: true, side: THREE.DoubleSide, depthWrite: true };
        const H_COLOR = 0x8a2be2;

        // --- Texture Editor Constants ---
        const CANVAS_SIZE = 128;
        const FACE_NAMES = {
            [GEOMETRY_TYPE_CUBE]: ['右', '左', '上', '下', '前', '后'],
            [GEOMETRY_TYPE_OCTAHEDRON]: ['面 1', '面 2', '面 3', '面 4', '面 5', '面 6', '面 7', '面 8'],
            [GEOMETRY_TYPE_DODECAHEDRON]: Array.from({ length: 12 }, (_, i) => `面 ${i + 1}`)
        };
        const STORAGE_KEY = 'threejs-polyhedron-editor-state';
        let saveTimeout = null;
        const SAVE_DELAY = 1000;

        // --- LocalStorage Persistence Logic ---

        function saveState() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const stateData = { N, M, cubes: [] };
                cubes.forEach(group => {
                    const mesh = group.children[0];
                    const texturesToSave = {};

                    for (const type of [GEOMETRY_TYPE_CUBE, GEOMETRY_TYPE_OCTAHEDRON, GEOMETRY_TYPE_DODECAHEDRON]) {
                        if (mesh.userData.canvases[type]?.length > 0) {
                            texturesToSave[type] = mesh.userData.canvases[type].map(canvas => canvas.toDataURL('image/png'));
                        }
                    }

                    stateData.cubes.push({
                        position: { x: group.position.x, y: group.position.y, z: group.position.z },
                        textures: texturesToSave,
                        geometryType: mesh.userData.geometryType, 
                        baseColor: mesh.userData.baseColor,         
                        baseOpacity: mesh.userData.baseOpacity,     
                    });
                });
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(stateData));
                } catch (error) {
                    console.error("Error saving state:", error);
                }
            }, SAVE_DELAY);
        }

        function loadState() {
            const storedState = localStorage.getItem(STORAGE_KEY);
            if (!storedState) return createGridPlane();

            try {
                const state = JSON.parse(storedState);
                N = state.N || 10;
                M = state.M || 10;
                document.getElementById('inputN').value = N;
                document.getElementById('inputM').value = M;
                
                createGridPlane();

                if (state.cubes?.length) {
                    state.cubes.forEach(addCubeFromState);
                }
                
                render();
            } catch (error) {
                console.error("Error loading state:", error);
                createGridPlane();
            }
        }
        
        function createObjectGroup(x, y, z) {
            const geom = new THREE.BoxGeometry(cw, cw, ch);
            const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: 0x000000 }));
            const mesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial(CUBE_MAT_BASE));
            
            const group = new THREE.Group();
            group.add(mesh);
            group.add(edges);
            group.position.set(x, y, z);
            
            mesh.userData = { 
                canvases: { [GEOMETRY_TYPE_CUBE]: [], [GEOMETRY_TYPE_OCTAHEDRON]: [], [GEOMETRY_TYPE_DODECAHEDRON]: [] },
                textures: { [GEOMETRY_TYPE_CUBE]: [], [GEOMETRY_TYPE_OCTAHEDRON]: [], [GEOMETRY_TYPE_DODECAHEDRON]: [] },
                geometryType: GEOMETRY_TYPE_CUBE,
                edges: edges,
                baseColor: DEFAULT_COLOR, 
                baseOpacity: DEFAULT_OPACITY, 
            };
            
            for (let i = 0; i < 6; i++) {
                const { canvas, texture } = createCanvasAndTexture(4);
                mesh.userData.canvases[GEOMETRY_TYPE_CUBE][i] = canvas;
                mesh.userData.textures[GEOMETRY_TYPE_CUBE][i] = texture;
            }
            
            const { baseColor, baseOpacity } = mesh.userData;
            mesh.material = mesh.userData.textures.cube.map(texture => {
                return createMaterialFromTexture(baseColor, baseOpacity, texture);
            });
            
            return group;
        }

        function addCubeFromState(cubeData) {
            const { x, y, z } = cubeData.position;
            const group = createObjectGroup(x, y, z);
            const mesh = group.children[0];
            
            mesh.userData.baseColor = cubeData.baseColor !== undefined ? cubeData.baseColor : DEFAULT_COLOR;
            mesh.userData.baseOpacity = cubeData.baseOpacity !== undefined ? cubeData.baseOpacity : DEFAULT_OPACITY;

            const loadPromises = [];

            for (const type in cubeData.textures) {
                const numFaces = FACE_NAMES[type]?.length || 0;
                let sides = 4;
                if (type === GEOMETRY_TYPE_OCTAHEDRON) sides = 3;
                if (type === GEOMETRY_TYPE_DODECAHEDRON) sides = 5;

                for (let i = 0; i < numFaces; i++) {
                     const { canvas, texture } = createCanvasAndTexture(sides);
                     mesh.userData.canvases[type][i] = canvas;
                     mesh.userData.textures[type][i] = texture;

                     const base64Data = cubeData.textures[type]?.[i];
                     if (base64Data) {
                         const promise = new Promise(resolve => {
                             const img = new Image();
                             img.onload = () => {
                                 canvas.getContext('2d').drawImage(img, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
                                 texture.needsUpdate = true;
                                 render();
                                 resolve();
                             };
                             img.onerror = resolve;
                             img.src = base64Data;
                         });
                         loadPromises.push(promise);
                     }
                }
            }

            scene.add(group);
            cubes.push(group);

            const geometryType = cubeData.geometryType || GEOMETRY_TYPE_CUBE;
            if (geometryType !== GEOMETRY_TYPE_CUBE) {
                switchGeometry(group, geometryType, false);
            } else {
                const materials = mesh.userData.textures.cube.map(tex => {
                    const mat = new THREE.MeshBasicMaterial(CUBE_MAT_BASE);
                    mat.color.set(mesh.userData.baseColor);
                    mat.opacity = mesh.userData.baseOpacity;
                    mat.map = tex;
                    return mat;
                });
                mesh.material = materials;
            }

            if (loadPromises.length > 0) Promise.all(loadPromises).then(render);
        }
        
        // --- Core Logic Functions ---

        function render() { renderer.render(scene, camera); }
        
function switchGeometry(cubeGroup, targetType, shouldSave = true) {
            const mesh = cubeGroup.children[0];
            const currentType = mesh.userData.geometryType;
            let newType;

            if (targetType) {
                newType = targetType;
            } else {
                const currentIndex = GEOMETRY_CYCLE.indexOf(currentType);
                newType = GEOMETRY_CYCLE[(currentIndex + 1) % GEOMETRY_CYCLE.length];
            }
            
            const { baseColor, baseOpacity, textures } = mesh.userData;
            const radius = cw / 2;

            mesh.geometry.dispose();
            if (mesh.userData.edges) {
                cubeGroup.remove(mesh.userData.edges);
                mesh.userData.edges.geometry.dispose();
                mesh.userData.edges.material.dispose();
            }

            let newGeometry, newEdges = null;
            let materials = [];

            switch (newType) {
                case GEOMETRY_TYPE_SPHERE:
                    newGeometry = new THREE.SphereGeometry(radius, 32, 32);
                    const singleMat = new THREE.MeshBasicMaterial(CUBE_MAT_BASE);
                    singleMat.color.set(baseColor);
                    singleMat.opacity = baseOpacity;
                    materials = singleMat;
                    break;
                case GEOMETRY_TYPE_OCTAHEDRON:
                    newGeometry = new THREE.OctahedronGeometry(radius);
                    
                    // --- BUG FIX START ---
                    // Octahedron has 8 faces, each is a triangle (3 vertices).
                    // We must define groups to map each of the 8 materials to a face.
                    newGeometry.groups = [];
                    for (let i = 0; i < 8; i++) {
                        // addGroup(start_index, count, material_index)
                        newGeometry.addGroup(i * 3, 3, i);
                    }
                    // --- BUG FIX END ---

                    const triUVs = [ new THREE.Vector2(0.5, 1), new THREE.Vector2(0.05, 0.2), new THREE.Vector2(0.95, 0.2) ];
                    const uvAttributeOcta = newGeometry.attributes.uv;
                    for (let i = 0; i < uvAttributeOcta.count / 3; i++) {
                        uvAttributeOcta.setXY(i * 3 + 0, triUVs[0].x, triUVs[0].y);
                        uvAttributeOcta.setXY(i * 3 + 1, triUVs[1].x, triUVs[1].y);
                        uvAttributeOcta.setXY(i * 3 + 2, triUVs[2].x, triUVs[2].y);
                    }
                    uvAttributeOcta.needsUpdate = true;
                    ensureCanvases(mesh, newType, 8, 3);
                    materials = textures[newType].map(createMaterialFromTexture.bind(null, baseColor, baseOpacity));
                    newEdges = createEdges(newGeometry);
                    break;
                case GEOMETRY_TYPE_DODECAHEDRON:
                    newGeometry = new THREE.DodecahedronGeometry(radius);

                    // --- BUG FIX START ---
                    // Dodecahedron has 12 faces. Each pentagonal face is rendered as 3 triangles (9 vertices).
                    // We must define groups to map each of the 12 materials to a face.
                    newGeometry.groups = [];
                    for (let i = 0; i < 12; i++) {
                        // addGroup(start_index, count, material_index)
                        newGeometry.addGroup(i * 9, 9, i);
                    }
                    // --- BUG FIX END ---
                    
                    const pentagonUVs = [];
                    for (let i = 0; i < 5; i++) {
                        let angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                        pentagonUVs.push(new THREE.Vector2(0.5 + 0.5 * Math.cos(angle), 0.5 + 0.5 * Math.sin(angle)));
                    }
                    const uvAttributeDodeca = newGeometry.attributes.uv;
                    for (let faceIndex = 0; faceIndex < 12; faceIndex++) {
                        const base = faceIndex * 9;
                        const p0=pentagonUVs[0], p1=pentagonUVs[1], p2=pentagonUVs[2], p3=pentagonUVs[3], p4=pentagonUVs[4];
                        uvAttributeDodeca.setXY(base + 0, p0.x, p0.y); uvAttributeDodeca.setXY(base + 1, p1.x, p1.y); uvAttributeDodeca.setXY(base + 2, p2.x, p2.y);
                        uvAttributeDodeca.setXY(base + 3, p0.x, p0.y); uvAttributeDodeca.setXY(base + 4, p2.x, p2.y); uvAttributeDodeca.setXY(base + 5, p3.x, p3.y);
                        uvAttributeDodeca.setXY(base + 6, p0.x, p0.y); uvAttributeDodeca.setXY(base + 7, p3.x, p3.y); uvAttributeDodeca.setXY(base + 8, p4.x, p4.y);
                    }
                    uvAttributeDodeca.needsUpdate = true;
                    ensureCanvases(mesh, newType, 12, 5);
                    materials = textures[newType].map(createMaterialFromTexture.bind(null, baseColor, baseOpacity));
                    newEdges = createEdges(newGeometry);
                    break;
                case GEOMETRY_TYPE_CUBE:
                default:
                    newGeometry = new THREE.BoxGeometry(cw, cw, ch);
                    ensureCanvases(mesh, newType, 6, 4);
                    materials = textures[newType].map(createMaterialFromTexture.bind(null, baseColor, baseOpacity));
                    newEdges = createEdges(newGeometry);
                    break;
            }

            mesh.geometry = newGeometry;
            mesh.material = materials;
            mesh.userData.edges = newEdges;
            mesh.userData.geometryType = newType;
            if (newEdges) {
                cubeGroup.add(newEdges);
            }
            
            if (currentCube === cubeGroup) {
                updateToggleButtonText(newType);
                setupTextureEditor(cubeGroup, true);
            }
            
            if (shouldSave) saveState();
            render();
        }

        function updateTip(isCubeMode) {
            const el = document.getElementById('tipMessage');
            el.innerHTML = isCubeMode ?
                `<span class="font-bold text-red-500">当前模式: 点击选择物体。</span> 选中的物体将高亮。
                 <span class="font-bold text-purple-600">按下 'Delete' 或 'Backspace' 删除选中的物体。</span>` :
                `提示: 拖动旋转。按 <span class="font-bold text-purple-600">'C'</span> 键创建立方体。点击 <span class="font-bold text-red-500">'S'</span> 键或紫色按钮切换到物体选择模式。`;
        }
        
        function hideTextureEditor() {
            if (currentCube) {
                restoreOriginalMaterial(currentCube);
                saveState(); 
            }
            currentCube = null;
            document.getElementById('textureEditorContainer').classList.add('hidden');
            controls.enabled = true; 
            render();
        }

        function toggleCubeSelectionMode() {
            isSelectMode = !isSelectMode;
            highlightMesh.visible = !isSelectMode; 
            if (!isSelectMode) hideTextureEditor();

            const btn = document.getElementById('toggleSelectMode');
            btn.textContent = isSelectMode ? "选择模式已开启 (S)" : "点击切换到选择模式 (S)";
            btn.classList.toggle('bg-purple-600', !isSelectMode);
            btn.classList.toggle('bg-pink-500', isSelectMode);
            updateTip(isSelectMode);
            render();
        }

        function deleteCube(cubeGroup) {
            if (!cubeGroup) return;
            scene.remove(cubeGroup);
            cubes.splice(cubes.indexOf(cubeGroup), 1);
            
            const mesh = cubeGroup.children[0];
            mesh.geometry?.dispose();
            Object.values(mesh.userData.textures).flat().forEach(t => t.dispose());
            
            hideTextureEditor(); 
            saveState(); 
            render();
        }
        
        function setupTextureEditor(cubeGroup, shouldUpdateCanvasesUI = true) {
            const editorDiv = document.getElementById('textureEditorContainer');
            const editorCanvasDiv = document.getElementById('textureCanvases');
            const brushControlsDiv = document.getElementById('brushControls');
            const mesh = cubeGroup.children[0];
            const { geometryType } = mesh.userData;

            const meshColorInput = document.getElementById('meshColor');
            const meshOpacityInput = document.getElementById('meshOpacity');
            const meshOpacityValueSpan = document.getElementById('meshOpacityValue');
            
            meshColorInput.value = `#${new THREE.Color(mesh.userData.baseColor).getHexString()}`;
            meshOpacityInput.value = mesh.userData.baseOpacity;
            meshOpacityValueSpan.textContent = mesh.userData.baseOpacity.toFixed(2);
            updateToggleButtonText(geometryType);

            const updateMaterialProps = () => {
                mesh.userData.baseColor = new THREE.Color(meshColorInput.value).getHex();
                mesh.userData.baseOpacity = parseFloat(meshOpacityInput.value);
                meshOpacityValueSpan.textContent = mesh.userData.baseOpacity.toFixed(2);
                applyHighlightEffect(mesh);
                saveState();
                render();
            };
            
            meshColorInput.oninput = updateMaterialProps;
            meshOpacityInput.oninput = updateMaterialProps;
            document.getElementById('toggleGeometry').onclick = () => switchGeometry(cubeGroup);

            if (geometryType === GEOMETRY_TYPE_SPHERE) {
                editorCanvasDiv.style.display = 'none';
                brushControlsDiv.style.display = 'none';
            } else {
                editorCanvasDiv.style.display = 'grid';
                brushControlsDiv.style.display = 'block';
                
                if (shouldUpdateCanvasesUI) {
                    const faceCanvases = mesh.userData.canvases[geometryType];
                    const faceTextures = mesh.userData.textures[geometryType];
                    const faceNames = FACE_NAMES[geometryType];
                    editorCanvasDiv.innerHTML = ''; 

                    faceCanvases.forEach((canvas, i) => {
                         canvas.className = 'border border-gray-400 shadow-inner bg-white cursor-crosshair w-full';
                         let isDrawing = false;
                         canvas.onmousedown = (e) => { isDrawing = true; e.stopPropagation(); const ctx = canvas.getContext('2d'); ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
                         canvas.onmousemove = (e) => { if (isDrawing) { const ctx = canvas.getContext('2d'); ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); faceTextures[i].needsUpdate = true; render(); } };
                         canvas.onmouseup = () => { isDrawing = false; saveState(); };
                         canvas.onmouseleave = () => { isDrawing = false; };
                         
                         const wrapper = document.createElement('div');
                         wrapper.className = 'flex flex-col items-center p-1 bg-gray-200 rounded-lg';
                         wrapper.innerHTML = `<span class="text-xs font-medium mb-1 text-gray-600">${faceNames[i]}</span>`;
                         wrapper.appendChild(canvas);
                         editorCanvasDiv.appendChild(wrapper);
                    });
                }
            }
            
            applyHighlightEffect(mesh);
            editorDiv.classList.remove('hidden');
            document.getElementById('deselectCube').onclick = hideTextureEditor;
            controls.enabled = false; 
            render();
        }

        function addCubeAtHighlightPosition() {
            if (!highlightMesh.visible) return; 
            const [targetX, targetZ] = [highlightMesh.position.x, highlightMesh.position.z];
            let maxTopY = 0; 
            cubes.forEach(g => { if (Math.abs(g.position.x-targetX)<.001 && Math.abs(g.position.z-targetZ)<.001) maxTopY = Math.max(maxTopY, g.position.y + cw/2); });
            const group = createObjectGroup(targetX, maxTopY + cw/2, targetZ);
            scene.add(group);
            cubes.push(group);
            saveState(); 
            render();
        }
        
        function createGridPlane() {
            if (scene) scene.children.slice().forEach(obj => { if (obj !== camera) scene.remove(obj); });
            cubes = [];
            hideTextureEditor(); 

            cw = 10 / N; ch = 10 / M; 

            planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            planeMesh.rotation.x = -Math.PI / 2;
            scene.add(planeMesh);
            
            const grid = new THREE.GridHelper(10, Math.max(N,M), 0x888888, 0x888888);
            grid.position.y = 0.001;
            scene.add(grid);

            highlightMesh = new THREE.Mesh(new THREE.PlaneGeometry(cw, ch), new THREE.MeshBasicMaterial({ color: 0x8a2be2, opacity: 0.5, transparent: true, side: THREE.DoubleSide }));
            highlightMesh.position.y = 0.002;
            highlightMesh.rotation.x = -Math.PI / 2;
            highlightMesh.visible = true;
            scene.add(highlightMesh);
        }
        
        // --- Helper Functions ---
        
        function drawPolygonMask(ctx, sides) {
            const centerX = CANVAS_SIZE / 2;
            const centerY = CANVAS_SIZE / 2;
            const radius = CANVAS_SIZE / 2 - 5; 
            const startAngle = -Math.PI / 2;

            ctx.beginPath();
            for (let i = 0; i <= sides; i++) {
                const angle = startAngle + (i * 2 * Math.PI / sides);
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.clip();
        }

        function createCanvasAndTexture(sides = 4) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = CANVAS_SIZE;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            if (sides !== 4) {
                drawPolygonMask(ctx, sides);
            }
            const texture = new THREE.CanvasTexture(canvas);
            return { canvas, texture };
        }
        
        function ensureCanvases(mesh, type, count, sides = 4) {
            if (mesh.userData.canvases[type].length < count) {
                const existingCount = mesh.userData.canvases[type].length;
                for (let i = existingCount; i < count; i++) {
                    const { canvas, texture } = createCanvasAndTexture(sides);
                    mesh.userData.canvases[type][i] = canvas;
                    mesh.userData.textures[type][i] = texture;
                }
            }
        }
        
        function createMaterialFromTexture(baseColor, baseOpacity, texture) {
            const mat = new THREE.MeshBasicMaterial(CUBE_MAT_BASE);
            mat.map = texture;
            mat.color.set(baseColor);
            mat.opacity = baseOpacity;
            return mat;
        }

        function createEdges(geometry) {
            return new THREE.LineSegments(
                new THREE.EdgesGeometry(geometry),
                new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
            );
        }
        
        function applyHighlightEffect(mesh) {
            const highlightColor = new THREE.Color(H_COLOR);
            const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
            materials.forEach(mat => {
                mat.color.set(highlightColor);
                mat.opacity = 0.95;
                mat.needsUpdate = true;
            });
            render();
        }
        
        function restoreOriginalMaterial(cubeGroup) {
             const mesh = cubeGroup.children[0];
             const { baseColor, baseOpacity, geometryType } = mesh.userData;
             if (geometryType === GEOMETRY_TYPE_SPHERE) {
                 mesh.material.color.set(baseColor);
                 mesh.material.opacity = baseOpacity;
             } else {
                 const originalTextures = mesh.userData.textures[geometryType];
                 mesh.material = originalTextures.map(createMaterialFromTexture.bind(null, baseColor, baseOpacity));
             }
        }
        
        function updateToggleButtonText(currentType) {
            const currentIndex = GEOMETRY_CYCLE.indexOf(currentType);
            const nextType = GEOMETRY_CYCLE[(currentIndex + 1) % GEOMETRY_CYCLE.length];
            document.getElementById('toggleGeometry').textContent = `切换到 ${GEOMETRY_NAMES[nextType]}`;
        }
        
        // --- Event Handlers ---

        function onMouseMove(event) {
            const bounds = container.getBoundingClientRect();
            mouse.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
            mouse.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
            
            if (!isSelectMode) { 
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(planeMesh, false);
                if (intersects.length > 0) {
                    const [x,z] = [intersects[0].point.x, intersects[0].point.z];
                    const [i,j] = [Math.floor((x + 5)/cw), Math.floor((z + 5)/ch)];
                    const [col,row] = [Math.max(0,Math.min(N-1, i)), Math.max(0,Math.min(M-1, j))];
                    highlightMesh.position.x = (col * cw) + (cw / 2) - 5;
                    highlightMesh.position.z = (row * ch) + (ch / 2) - 5;
                    highlightMesh.visible = true;
                } else {
                    highlightMesh.visible = false;
                }
                render();
            } 
        }

        function onMouseDown(event) {
            if (event.button !== 0 || !isSelectMode) return; 
            event.stopPropagation();
            raycaster.setFromCamera(mouse, camera);
            const intersectableMeshes = cubes.map(g => g.children[0]);
            const hitGroup = raycaster.intersectObjects(intersectableMeshes, false)[0]?.object.parent || null; 

            if (hitGroup) {
                 if (hitGroup === currentCube) {
                    hideTextureEditor();
                } else {
                    if (currentCube) hideTextureEditor();
                    currentCube = hitGroup;
                    setupTextureEditor(currentCube);
                }
            } else {
                hideTextureEditor();
            }
        }
        
        function onKeyDown(event) {
            if ((event.key === 's' || event.key === 'S') && !event.repeat) {
                toggleCubeSelectionMode();
            } else if ((event.key === 'Delete' || event.key === 'Backspace') && isSelectMode && currentCube) {
                event.preventDefault();
                deleteCube(currentCube);
            } else if ((event.key === 'c' || event.key === 'C') && !isSelectMode && highlightMesh.visible) {
                addCubeAtHighlightPosition();
            } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();
                const speed = 0.1;
                switch (event.key) {
                    case 'ArrowUp': camera.position.addScaledVector(direction, speed); controls.target.addScaledVector(direction, speed); break;
                    case 'ArrowDown': camera.position.addScaledVector(direction, -speed); controls.target.addScaledVector(direction, -speed); break;
                    case 'ArrowLeft': const left = direction.clone().cross(upVector); camera.position.addScaledVector(left, speed); controls.target.addScaledVector(left, speed); break;
                    case 'ArrowRight': const right = direction.clone().cross(upVector).negate(); camera.position.addScaledVector(right, speed); controls.target.addScaledVector(right, speed); break;
                }
                controls.update();
                render();
                event.preventDefault();
            }
        }

        // --- Initialization ---

        function init() {
            const container = document.getElementById('container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1f2937);

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 8, 5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.addEventListener('change', render);

            // Bind editor controls
            document.getElementById('brushColor').addEventListener('input', (e) => brushColor = e.target.value);
            document.getElementById('brushSize').addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value, 10);
                document.getElementById('brushSizeValue').textContent = `${brushSize}px`;
            });
            
            loadState(); // Load previous state or create a new grid
            
            // --- Event Listeners ---
            window.addEventListener('resize', () => {
                const w = container.clientWidth, h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
                render();
            }, false);
            
            container.addEventListener('mousemove', onMouseMove, false);
            container.addEventListener('mousedown', onMouseDown, false); 
            window.addEventListener('keydown', onKeyDown, false);
            
            document.getElementById('generateButton').addEventListener('click', () => {
                N = parseInt(document.getElementById('inputN').value);
                M = parseInt(document.getElementById('inputM').value);
                createGridPlane();
                saveState();
                render();
            });
            document.getElementById('toggleSelectMode').addEventListener('click', toggleCubeSelectionMode);
        }
        
        window.onload = init;
    </script>
</body>
</html>
